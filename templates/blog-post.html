<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="../../assets/img/favicon.png" type="image/png">
  <title>{{TITLE}} — ERI / CLI</title>
  <script>
    (() => {
      try {
        const s = localStorage.getItem('eri-theme');
        const p = matchMedia('(prefers-color-scheme: light)').matches;
        if (s === 'light' || (!s && p)) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (_) {}

      function syncButtons() {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        document.querySelectorAll('[data-theme-toggle]').forEach((btn) => {
          btn.textContent = isLight ? 'DARK' : 'LIGHT';
          btn.setAttribute('aria-label', isLight ? 'Switch to dark theme' : 'Switch to light theme');
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncButtons);
      } else {
        syncButtons();
      }

      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-theme-toggle]');
        if (!btn) return;
        e.preventDefault();
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        const next = isLight ? 'dark' : 'light';
        if (next === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        try {
          localStorage.setItem('eri-theme', next);
        } catch (_) {}
        syncButtons();
      });
    })();
  </script>
  <link rel="stylesheet" href="../../assets/css/style.css?v=1.3.0">
  <link rel="stylesheet" href="../../assets/logo/logo-motion.css?v=1.3.0">
  <script defer src="../../assets/js/pages.js?v=1.3.0"></script>
  <script defer src="../../assets/logo/logo-motion.js?v=1.3.0"></script>
</head>
<body>
  <a class="skip-link" href="#article">Skip to article</a>
  <header class="site-head">
    <a class="brand eri-cli-logo" href="../../index.html" aria-label="ERI / CLI — Home" style="--logo-size: clamp(110px, 8.4vw, 145px);"><img src="../../assets/logo/logo-static.svg" alt="" width="145" height="145"></a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="../../projects.html">Projects</a>
      <a href="../../about.html">About</a>
      <a href="../../blog/index.html" aria-current="page">Blog</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle color theme">LIGHT</button>
    </nav>
  </header>

  <main class="page-main reader-page" id="article">
    <article>
      <header class="reader-head three-grid">
        <p class="reader-meta meta">{{CATEGORY}}<br><time datetime="{{DATE}}">{{DATE_FORMATTED}}</time><br>{{READING_TIME}} min read</p>
        <div class="reader-title-wrap">
          <h1 class="page-title">{{TITLE}}</h1>
          <nav class="reader-quicknav" aria-label="Article navigation">
            {{PREVIOUS_POST_QUICK}}
            {{NEXT_POST_QUICK}}
          </nav>
        </div>
      </header>

      <div class="reader-cut" aria-hidden="true">
        <div class="lattice-host reader-lattice" data-lattice="reader"></div>
      </div>

      <div class="reader-body three-grid" id="article-body">
        <div class="reader-prose">
          {{ARTICLE_HTML}}
        </div>
      </div>
    </article>

    <nav class="reader-nav three-grid" aria-label="Article navigation">
      <a href="../../blog/index.html">Back to Blog</a>
      <div class="reader-adjacent">{{ADJACENT_NAV}}</div>
    </nav>
  </main>

  <footer class="site-foot">
    <p class="foot-home meta">ERI / CLI<br>Blog</p>
    <a class="foot-contact" href="mailto:helloworld@n5hq.me">helloworld@n5hq.me</a>
    <nav class="foot-links" aria-label="Footer navigation"><a href="../../projects.html">Projects</a><a href="../../about.html">About</a><a href="https://github.com/aerwk">GitHub</a></nav>
  </footer>
</body>
</html>
