<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Eric Li's notes on homelab infrastructure, projects and web work.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="../assets/img/favicon.png" type="image/png">
  <title>Blog — ERI / CLI</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=1.1.0">
  <script defer src="../assets/js/pages.js"></script>
  <script defer src="../assets/logo/logo-motion.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to the archive</a>
  <header class="site-head">
    <a class="brand eri-cli-logo" href="../index.html" aria-label="ERI / CLI — Home"><img src="../assets/logo/logo-static.svg" alt="" width="440" height="440"></a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="../projects.html">Projects</a>
      <a href="../about.html">About</a>
      <a href="index.html" aria-current="page">Blog</a>
    </nav>
  </header>

  <main class="page-main blog-page" id="content">
    <header class="blog-intro three-grid">
      <div class="archive-note">
        <p class="page-note">Notes on the homelab, projects and this website, written while the work was still fresh.</p>
        <div class="blog-filters" aria-label="Filter posts">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="homelab" aria-pressed="false">Homelab</button>
          <button type="button" data-filter="projects" aria-pressed="false">Projects</button>
          <button type="button" data-filter="web" aria-pressed="false">Web</button>
        </div>
        <p class="filter-status sr-only" role="status" aria-live="polite" data-filter-status></p>
      </div>
      <h1 class="page-title">Blog</h1>
    </header>

    <section class="blog-register" aria-label="Post archive">
      <div class="lattice-host blog-lattice" data-lattice="blog" aria-hidden="true"></div>
      <ol class="post-list">
        {{POSTS}}
      </ol>
    </section>
  </main>

  <footer class="site-foot">
    <p class="foot-home meta">ERI / CLI<br>Blog archive</p>
    <a class="foot-contact" href="mailto:helloworld@n5hq.me">helloworld@n5hq.me</a>
    <nav class="foot-links" aria-label="Footer navigation"><a href="../projects.html">Projects</a><a href="../about.html">About</a><a href="https://github.com/aerwk">GitHub</a></nav>
  </footer>
</body>
</html>
